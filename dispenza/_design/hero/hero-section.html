<!-- =============================================================================
     HeroSection  --  the canonical fragment. THIS FILE IS THE SSOT.

     client-rules.json -> heroContract requires the hero to be "HeroSection, its
     own file, self-contained", with the media layer separated from the content
     layer and a swap that causes no reflow and touches nothing else. This is
     that file. Its two companions are hero-section.css (every .mc-hero* rule,
     kept out of the global body sheet per heroContract.style_isolation) and
     hero-field.js (the entire media payload).

     Pages inline this fragment verbatim. It is reproduced, never re-authored: if
     the hero changes, it changes HERE and the pages take the new copy.

     WHY THE COMPONENT CARRIES ITS OWN STYLESHEET LINK AND SCRIPT TAG RATHER THAN
     PUTTING THEM IN THE PAGE PREAMBLE. Two reasons, one principled, one practical.
       Principled: heroContract.style_isolation says no hero-specific styles may
       leak into global CSS. Linking the sheet from the component means ONLY a
       page that actually contains a hero ever loads hero CSS -- a preamble link
       would put it on all 27 pages including the 26 that have no hero.
       rel="stylesheet" is body-ok in the HTML Living Standard, and the link sits
       BEFORE the section, so the hero never paints unstyled.
       Practical: G-CHROME-CARRIER-REDIRECT classifies every byte outside
       <main> as chrome frame and bounces hand-edits there, while the chrome
       carrier (_design/_chrome-block.html) is body-level markup holding no
       preamble and no stylesheet links at all, so its redirect target cannot
       hold one. Carrying the assets on the component resolves that
       contradiction instead of working around the gate.

     THE ONE THING THAT VARIES BY HOST. The two asset paths below are written for
     a host two directories below _design/ (a tournament preview at
     _design/_tournament/<concept>/). A page assembled into pages/ needs
     ../_design/hero/... instead. Nothing else in this fragment changes.

     THE SWAP. Everything between the two ANIMATED HERO SLOT markers is the media
     layer. Replace what is inside them -- an img, this svg, a canvas, a video --
     and nothing else on the page moves. The stage is absolutely positioned and
     contributes no height, so the section is sized by the measured column alone.

     Owner decisions carried here (2026-08-12, in the order they were made):
       media = the generated isometric hex-prism field (replaced the raster
               assets/generated/hero-placeholder.jpg)
       light = scroll-linked, no timeline, still when the visitor is still
       hover = the hexagons light up under the pointer (owner request)
       text  = KINETIC TYPE, from the owner-supplied reference
               dispenza-hero-kinetic-type.html. This SUPERSEDED the T-1 static
               bloom that shipped a few hours earlier the same day; T-1 is gone,
               not layered underneath.
       scrim = re-anchored to the CONTAINER rather than the viewport, after the
               owner reported the hero reading lopsided. See hero-section.css
               section 2 for the measurements.
       caret = the SINGLE LIGHT SOURCE, from the owner-supplied reference
               dispenza-hero-glow-caret.html. It scans the lead sentence once on
               entry and then rests at the final period; the headline, the floor
               pool and the hex field are all lit from wherever it sits. It
               replaced the 9s timed sweep, so the hero no longer loops at all.
               The reference reached the same light by TYPING five phrases, four
               of which are not in the 677-fact registry; see hero-section.css
               section 3b for why that half was not adopted.
     ============================================================================= -->
<link rel="stylesheet" href="../../hero/hero-section.css">
<section class="mc-hero" id="hero">
  <!-- The PIN. It carries .container--full so the DOM grammar stays legal
       (section > .container > .row > .col > object); a bare sticky wrapper
       between the section and the container would break G-DOM. -->
  <div class="container container--full mc-hero__pin">
    <div class="row">
      <div class="col">

        <div class="mc-hero__stage" data-media-in>
          <!-- ANIMATED HERO SLOT — replace media layer only -->
          <!-- Two generated layers occupy the slot: the receding hex field
               (hero-field.js) and the scroll-scrubbed hex platform
               (hero-coaster.js, geometry measured off the owner's
               hexagonal-metal-coaster.obj). Both are aria-hidden decorative
               texture -- they state nothing the claim does not already say, so
               announcing them would only add noise to a screen reader. -->
          <svg class="mc-hero__field" viewBox="0 0 1400 760"
               preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"></svg>
          <!-- END ANIMATED HERO SLOT -->
        </div>

        <div class="mc-hero__scrim" aria-hidden="true"></div>

        <!-- The smoke. A canvas rather than SVG because this is a few hundred
             particles integrated every frame; SVG nodes would not hold 60fps.
             It sits BEHIND the token so the token reads as a solid in it. -->
        <canvas class="mc-smoke" aria-hidden="true"></canvas>

        <!-- ============================================================
             THE COIN. The owner's tripo3d GLB replaces the SVG solid.

             SUPPLIED AT 29.94 MB / 1,001,316 triangles, which is 10-30x a
             sane hero budget against this brief's own LCP < 2.5s. Optimised
             rather than refused: welded, simplified to 100,128 triangles at
             a 0.0004 error, texture to WebP 1024, geometry Draco-compressed
             -> 1.3 MB. A first pass at gltf-transform's default aggression
             produced 6,700 triangles (99.3% gone) and lost the milling and
             the knurled chevron entirely, which is why the budget is set
             explicitly here rather than left to a preset.

             The runtime and the Draco decoder are BOTH vendored into
             _design/vendor/. model-viewer otherwise fetches its decoder from
             gstatic at run time, and this build already refuses CDN
             dependencies -- that rule was written when the live site's fonts
             were found loading from Google.
             ============================================================ -->
        <model-viewer class="mc-coin" src="../../../assets/3d/dispenza-coin.glb"
                      alt="The Dispenza challenge coin: a hexagonal enamel and polished metal token carrying the Dispenza mark."
                      camera-orbit="90deg 90deg 2.75m" field-of-view="22deg"
                      environment-image="../../../assets/3d/studio-violet.png"
                      exposure="1.25" tone-mapping="aces"
                      shadow-intensity="0"   /* floating: a contact shadow implies a surface */
                      disable-zoom disable-pan disable-tap
                      interaction-prompt="none" camera-controls="false"
                      loading="eager"></model-viewer>

        <!-- The SVG solid stays as the FALLBACK, hidden once the model reports
             loaded. It is a complete, self-contained coin with no runtime cost,
             so a WebGL-less or slow client still gets an object in the hero
             rather than a hole. hero-coaster.js keeps driving it either way,
             which is also what supplies the pose the model is slaved to. -->
        <svg class="mc-coaster" viewBox="0 0 1400 900"
             preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
          <defs>
            <filter id="coasterShadow" x="-60%" y="-160%" width="220%" height="420%">
              <feGaussianBlur stdDeviation="18"/>
            </filter>
            <!-- POLISHED METAL IS A GRADIENT, NOT A TONE. A flat fill lit by a
                 single Lambert term gave the rim one value across its whole face
                 and it read as grey paint. A mirror's character is that it
                 reflects its surroundings, so it swings bright-to-dark across the
                 surface; these two ramps supply that, and the per-face Lambert
                 still modulates them as the coin turns. -->
            <linearGradient id="coinRim" x1="0.08" y1="0" x2="0.92" y2="1">
              <stop offset="0%"   stop-color="#ffffff"/>
              <stop offset="18%"  stop-color="#e3e3e3"/>
              <stop offset="42%"  stop-color="#9d95a8"/>
              <stop offset="63%"  stop-color="#f2eef7"/>
              <stop offset="82%"  stop-color="#6d6478"/>
              <stop offset="100%" stop-color="#3a3442"/>
            </linearGradient>
            <linearGradient id="coinEnamel" x1="0.1" y1="0" x2="0.9" y2="1">
              <stop offset="0%"   stop-color="#7a4bc8"/>
              <stop offset="38%"  stop-color="#5a2ea0"/>
              <stop offset="72%"  stop-color="#3d1a72"/>
              <stop offset="100%" stop-color="#2a1152"/>
            </linearGradient>
          </defs>
          <!-- All three layers ride in ONE group so the anti-overlap pass can
               translate the whole token as a unit after measuring it. -->
          <g class="mc-coaster__all">
            <ellipse class="mc-coaster__shadow" cx="700" cy="700" rx="0" ry="0"
                     fill="#000" opacity="0" filter="url(#coasterShadow)"/>
            <g class="mc-coaster__faces"></g>
            <!-- The client's real mark, struck into the token's face. Supplied as
                 a JPEG on pure black; keyed to alpha and cropped to its content
                 so it composites on the dark face instead of sitting in a black
                 square. It is laid out in a 64x64 box so it takes the SAME affine
                 matrix the vector chevron used -- the projection code did not
                 change to accommodate it. -->
            <image class="mc-coaster__mark" x="0" y="0" width="64" height="64"
                   preserveAspectRatio="xMidYMid meet" opacity="0"
                   href="../../../assets/brand/dispenza-token-mark.png"></image>
          </g>
        </svg>

        <div class="mc-hero__content mc-type">
          <p class="mc-eyebrow" data-reveal>Since 2012</p>
          <!-- Every character is authored HERE, in its own span. The reveal
               animates OPACITY only; no script writes text into the DOM.
               That is the only implementation that ships: verify-copy-fidelity
               reads the authored FILE, so a headline assembled at runtime from a
               JS string would leave this page with no headline as far as the gate
               is concerned. Text content is byte-identical to the corpus:
               "#1 MARKETING" + "AGENCY IN CANNABIS", with no space between
               MARKETING and AGENCY because the turn line is display:block. -->
          <h1 class="mc-display" data-reveal><span class="ch">#</span><span class="ch">1</span><span class="ch sp"> </span><span class="ch">M</span><span class="ch">A</span><span class="ch">R</span><span class="ch">K</span><span class="ch">E</span><span class="ch">T</span><span class="ch">I</span><span class="ch">N</span><span class="ch">G</span><span class="mc-display__turn"><span class="ch">A</span><span class="ch">G</span><span class="ch">E</span><span class="ch">N</span><span class="ch">C</span><span class="ch">Y</span><span class="ch sp"> </span><span class="ch">I</span><span class="ch">N</span><span class="ch sp"> </span><span class="ch">C</span><span class="ch">A</span><span class="ch">N</span><span class="ch">N</span><span class="ch">A</span><span class="ch">B</span><span class="ch">I</span><span class="ch">S</span></span></h1>
          <!-- The lead is D-SRC-INDEX-0043, verbatim and whole. The caret is an
               empty span that adds no text, and it lives INSIDE the paragraph so
               the element stays a real <p> and keeps .mc-body's top margin, which
               an inline wrapper would silently drop. aria-hidden because it is a
               light, not a cursor: there is no editable field here. -->
          <p class="mc-body mc-body--lead mc-lead-wrap" data-reveal><span class="ch">D</span><span class="ch">i</span><span class="ch">s</span><span class="ch">p</span><span class="ch">e</span><span class="ch">n</span><span class="ch">z</span><span class="ch">a</span><span class="ch sp"> </span><span class="ch">i</span><span class="ch">s</span><span class="ch sp"> </span><span class="ch">t</span><span class="ch">h</span><span class="ch">e</span><span class="ch sp"> </span><span class="ch">u</span><span class="ch">l</span><span class="ch">t</span><span class="ch">i</span><span class="ch">m</span><span class="ch">a</span><span class="ch">t</span><span class="ch">e</span><span class="ch sp"> </span><span class="ch">d</span><span class="ch">i</span><span class="ch">g</span><span class="ch">i</span><span class="ch">t</span><span class="ch">a</span><span class="ch">l</span><span class="ch sp"> </span><span class="ch">p</span><span class="ch">a</span><span class="ch">r</span><span class="ch">t</span><span class="ch">n</span><span class="ch">e</span><span class="ch">r</span><span class="ch">.</span><span class="ch sp"> </span><span class="ch">W</span><span class="ch">e</span><span class="ch sp"> </span><span class="ch">h</span><span class="ch">a</span><span class="ch">n</span><span class="ch">d</span><span class="ch">l</span><span class="ch">e</span><span class="ch sp"> </span><span class="ch">e</span><span class="ch">v</span><span class="ch">e</span><span class="ch">r</span><span class="ch">y</span><span class="ch">t</span><span class="ch">h</span><span class="ch">i</span><span class="ch">n</span><span class="ch">g</span><span class="ch sp"> </span><span class="ch">o</span><span class="ch">n</span><span class="ch">l</span><span class="ch">i</span><span class="ch">n</span><span class="ch">e</span><span class="ch">,</span><span class="ch sp"> </span><span class="ch">s</span><span class="ch">o</span><span class="ch sp"> </span><span class="ch">y</span><span class="ch">o</span><span class="ch">u</span><span class="ch sp"> </span><span class="ch">c</span><span class="ch">a</span><span class="ch">n</span><span class="ch sp"> </span><span class="ch">f</span><span class="ch">o</span><span class="ch">c</span><span class="ch">u</span><span class="ch">s</span><span class="ch sp"> </span><span class="ch">o</span><span class="ch">n</span><span class="ch sp"> </span><span class="ch">g</span><span class="ch">r</span><span class="ch">o</span><span class="ch">w</span><span class="ch">t</span><span class="ch">h</span><span class="ch">.</span></p>
          <div class="mc-actions" data-reveal>
            <a class="btn btn--solid" href="contact.html">Book demo</a>
            <a class="btn btn--ghost" href="how-it-works.html">Learn how</a>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
<!-- Loaded AFTER the section so the svg it fills already exists in the DOM; no
     DOMContentLoaded wrapper is needed and none is used. -->
<script src="../../hero/hero-field.js"></script>
<script src="../../hero/hero-coaster.js"></script>
<script src="../../hero/hero-coin3d.js"></script>
<script src="../../hero/hero-smoke.js"></script>
